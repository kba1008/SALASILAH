<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes" />
  <meta name="theme-color" content="#0b1a3a" id="metaTheme" />
  <title>Salasilah Keluarga Elit</title>
  <meta name="description" content="Pengurusan salasilah keluarga dengan draf dan pengesahan pentadbir." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="https://api.iconify.design/mdi/family-tree.svg?color=%238a6d3b" />
  <link rel="apple-touch-icon" href="https://api.iconify.design/mdi/family-tree.svg?color=%238a6d3b" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Cinzel:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#f7efd9; --bg2:#efe2bf; --ink:#2c2210; --ink-soft:#5b4a26;
      --gold:#b08a3e; --gold-2:#d9b96b; --line:#b89a5a;
      --card:#fffaf0; --card-2:#f0e4c2; --shadow:rgba(60,40,10,.35);
      --accent:#7a5a1e; --danger:#8b1d1d; --ok:#1f6b3a;
      --font-head:'Cinzel', serif; --font-body:'Inter', system-ui, sans-serif;
    }
    [data-theme="royal"] {
      --bg:#0b1a3a; --bg2:#142a55; --ink:#fff7df; --ink-soft:#e9d9a5;
      --gold:#e9c66b; --gold-2:#ffe39a; --line:#caa353;
      --card:#142a55; --card-2:#1d3a72; --shadow:rgba(0,0,0,.55);
      --accent:#ffd97a; --danger:#ff8a8a; --ok:#a6e9b8;
    }
    [data-theme="emerald"] {
      --bg:#0f2a1f; --bg2:#16402e; --ink:#f4ffe9; --ink-soft:#d8ecc1;
      --gold:#e2c96a; --gold-2:#fde79a; --line:#9bb86a;
      --card:#1a4231; --card-2:#235b41; --shadow:rgba(0,0,0,.5);
      --accent:#ffe88f; --danger:#ffb0a0; --ok:#bff0c2;
    }
    [data-theme="rose"] {
      --bg:#fde8ee; --bg2:#fbd0dc; --ink:#3b0d1e; --ink-soft:#7a2440;
      --gold:#b8336a; --gold-2:#e26a99; --line:#c46086;
      --card:#fff5f8; --card-2:#fcd9e3; --shadow:rgba(120,30,60,.3);
      --accent:#a02458; --danger:#7a1b1b; --ok:#1f6b3a;
    }
    [data-theme="midnight"] {
      --bg:#08070a; --bg2:#161217; --ink:#fff3c8; --ink-soft:#e6d28a;
      --gold:#f1c75b; --gold-2:#ffe18a; --line:#a78232;
      --card:#181318; --card-2:#221a22; --shadow:rgba(0,0,0,.7);
      --accent:#ffd76a; --danger:#ff9a9a; --ok:#a6e9b8;
    }

    html, body { height:100%; }
    body {
      margin:0; color:var(--ink);
      font-family:var(--font-body);
      background:
        radial-gradient(1200px 800px at 20% 10%, color-mix(in oklab, var(--gold) 18%, transparent), transparent 60%),
        radial-gradient(1000px 700px at 80% 90%, color-mix(in oklab, var(--gold-2) 14%, transparent), transparent 60%),
        linear-gradient(135deg, var(--bg), var(--bg2));
      overflow:hidden;
    }
    .font-head { font-family:var(--font-head); letter-spacing:.5px; }
    .ink { color:var(--ink) } .ink-soft { color:var(--ink-soft) }

    .bevel {
      background:linear-gradient(180deg, color-mix(in oklab, var(--card) 92%, white 8%), var(--card-2));
      border:1px solid color-mix(in oklab, var(--line) 60%, transparent);
      box-shadow:
        0 1px 0 rgba(255,255,255,.35) inset,
        0 -2px 0 color-mix(in oklab, var(--shadow) 50%, transparent) inset,
        0 14px 30px -10px var(--shadow),
        0 6px 12px -6px var(--shadow);
    }
    .bevel-soft {
      background:linear-gradient(180deg, var(--card), var(--card-2));
      border:1px solid color-mix(in oklab, var(--line) 40%, transparent);
      box-shadow:
        0 1px 0 rgba(255,255,255,.25) inset,
        0 8px 22px -10px var(--shadow);
    }
    .gold-edge {
      background:linear-gradient(180deg, var(--gold-2), var(--gold));
      color:#241704; text-shadow:0 1px 0 rgba(255,255,255,.4);
      box-shadow:
        0 1px 0 rgba(255,255,255,.6) inset,
        0 -2px 0 rgba(80,50,10,.35) inset,
        0 10px 22px -8px var(--shadow);
      border:1px solid color-mix(in oklab, var(--line) 70%, black 0%);
    }
    .gold-edge:hover { filter:brightness(1.05); }
    .gold-edge:active { transform:translateY(1px); filter:brightness(.97); }

    .btn {
      display:inline-flex; align-items:center; gap:.5rem;
      padding:.55rem .9rem; border-radius:.7rem; font-weight:600; font-size:.9rem;
      cursor:pointer; user-select:none; transition:transform .08s ease, filter .15s ease;
    }
    .btn-ghost { background:transparent; color:var(--ink); border:1px solid color-mix(in oklab, var(--line) 50%, transparent) }
    .btn-ghost:hover { background:color-mix(in oklab, var(--gold) 12%, transparent) }
    .chip { padding:.2rem .55rem; border-radius:999px; font-size:.7rem; font-weight:700; }

    .topbar {
      position:fixed; top:0; left:0; right:0; z-index:40;
      backdrop-filter: blur(10px);
      background:linear-gradient(180deg, color-mix(in oklab, var(--bg) 88%, transparent), color-mix(in oklab, var(--bg) 60%, transparent));
      border-bottom:1px solid color-mix(in oklab, var(--line) 40%, transparent);
    }

    #stage {
      position:absolute; inset:0; top:60px; overflow:hidden;
      background-image:
        radial-gradient(color-mix(in oklab, var(--ink) 10%, transparent) 1px, transparent 1px);
      background-size: 28px 28px;
      background-position: 0 0;
    }
    #world {
      position:relative; width:6000px; height:4000px;
      transform-origin:0 0;
    }

    .node {
      position:absolute; width:220px;
      border-radius:18px; padding:14px;
      background:linear-gradient(180deg, color-mix(in oklab, var(--card) 96%, white 4%), var(--card-2));
      border:1px solid color-mix(in oklab, var(--line) 65%, transparent);
      box-shadow:
        0 1px 0 rgba(255,255,255,.45) inset,
        0 -3px 0 color-mix(in oklab, var(--shadow) 60%, transparent) inset,
        0 22px 40px -14px var(--shadow),
        0 10px 18px -8px var(--shadow);
      transform-style:preserve-3d;
      transition:transform .15s ease, box-shadow .15s ease;
      cursor:pointer;
    }
    .node:hover { transform:translateY(-2px) rotateX(2deg); }
    .node.male { outline:2px solid color-mix(in oklab, #4b86c6 60%, transparent); }
    .node.female { outline:2px solid color-mix(in oklab, #c6679a 60%, transparent); }
    .node.deceased { filter:grayscale(.3) brightness(.95); }
    /* Kepala Salasilah (root utama) — penanda mahkota & sempadan emas tebal */
    .node.root-head {
      outline:3px solid var(--gold) !important;
      box-shadow:0 0 0 2px color-mix(in oklab, var(--gold-2) 70%, transparent), 0 10px 26px var(--shadow);
    }
    .node.root-head::before {
      content:"👑"; position:absolute; top:-14px; left:50%; transform:translateX(-50%);
      font-size:20px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.45)); pointer-events:none;
    }
    .root-head-chip {
      background:linear-gradient(180deg, var(--gold-2), var(--gold)); color:#241704;
    }
    .node.tag-member {
      outline:3px solid var(--gold); box-shadow:0 0 0 4px color-mix(in oklab, var(--gold) 30%, transparent), 0 22px 40px -14px var(--shadow);
      background:linear-gradient(180deg, color-mix(in oklab, var(--gold-2) 18%, var(--card)), var(--card-2)); 
    }
    .node.tag-admin {
      outline:3px solid #e74c3c; box-shadow:0 0 0 4px rgba(231,76,60,.35), 0 22px 40px -14px var(--shadow);
      background:linear-gradient(180deg, color-mix(in oklab, #ff8a8a 18%, var(--card)), var(--card-2)); 
    }
    /* Kad DRAF — belum disahkan admin: kotak & font jadi kelabu */
    .node.tag-draft {
      outline:2px dashed #9a9a9a !important;
      box-shadow:0 10px 22px -12px rgba(0,0,0,.45) !important;
      background:linear-gradient(180deg,#ececec,#d8d8d8) !important;
      color:#6f6f6f !important;
    }
    .node.tag-draft .nm,
    .node.tag-draft .yrs { color:#6f6f6f !important; }
    .node.tag-draft .avatar {
      background:linear-gradient(180deg,#cfcfcf,#b6b6b6) !important;
      color:#6b6b6b !important; filter:grayscale(1);
    }
    .node.tag-draft .avatar img { filter:grayscale(1) opacity(.85); }
    .chip.draft-chip { background:#6f6f6f !important; color:#fff !important; }



    .member-card {
      position:relative; border-radius:18px; padding:16px; color:#1a1208;
      background:linear-gradient(135deg,#fff3c4 0%, #e9c66b 45%, #b08a3e 100%);
      box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 -3px 0 rgba(80,50,10,.3) inset, 0 24px 50px -16px rgba(0,0,0,.45);
      overflow:hidden; border:1px solid #8a6a2a; 
    }
    .member-card .mc-bg {
      position:absolute; inset:0; opacity:.15; pointer-events:none;
      background:repeating-linear-gradient(45deg, transparent 0 14px, rgba(255,255,255,.4) 14px 15px),
                 radial-gradient(circle at 80% 20%, rgba(255,255,255,.6), transparent 50%); 
    }
    .member-card .mc-head { position:relative; display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .member-card .mc-crest {
      width:46px;height:46px; border-radius:50%; display:grid;place-items:center;
      background:radial-gradient(circle, #fff7d8, #c79c3a); border:2px solid #6b4f1f; font-size:24px; color:#3b260a; 
    }
    .member-card .mc-title { font-family:var(--font-head); font-weight:800; letter-spacing:2px; font-size:14px; }
    .member-card .mc-sub { font-size:11px; opacity:.8; }
    .member-card .mc-body { position:relative; display:flex; gap:14px; align-items:center; }
    .member-card .mc-photo {
      width:84px; height:84px; border-radius:12px; overflow:hidden; flex-shrink:0;
      background:#fff; border:2px solid #6b4f1f; display:grid; place-items:center; font-weight:800; font-size:28px; color:#3b260a; 
    }
    .member-card .mc-photo img { width:100%;height:100%; object-fit:cover; }
    .member-card .mc-info { flex:1; min-width:0; }
    .member-card .mc-name { font-family:var(--font-head); font-size:18px; font-weight:800; margin-bottom:4px; }
    .member-card .mc-row { display:flex; justify-content:space-between; gap:8px; font-size:12px; padding:2px 0; border-bottom:1px dashed rgba(60,40,10,.3); }
    .member-card .mc-row span { opacity:.8; }
    .member-card .mc-foot { position:relative; margin-top:10px; font-size:11px; text-align:center; opacity:.85; font-style:italic; }
    
    .node .avatar {
      width:64px; height:64px; border-radius:50%;
      background:linear-gradient(180deg, var(--gold-2), var(--gold));
      display:grid; place-items:center; color:#241704;
      box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 6px 12px -4px var(--shadow);
      margin:0 auto 8px;
      overflow:hidden; font-weight:800;
    }
    .node .avatar img { width:100%; height:100%; object-fit:cover }
    .node .nm { font-family:var(--font-head); text-align:center; font-weight:800; line-height:1.1 }
    .node .yrs { text-align:center; font-size:.78rem; color:var(--ink-soft); margin-top:2px }
    .node .row { display:flex; justify-content:center; gap:.4rem; margin-top:6px }

    svg.links { position:absolute; inset:0; width:100%; height:100%; pointer-events:none }
    svg.links path { stroke:var(--line); stroke-width:2.2; fill:none; filter: drop-shadow(0 2px 0 color-mix(in oklab, var(--shadow) 35%, transparent)); }
    svg.links path.spouse { stroke-dasharray:6 5; stroke:var(--gold); }
    /* Hubungan DRAF (belum disahkan): garisan kelabu putus-putus */
    svg.links path.draft-link { stroke:#9a9a9a !important; stroke-dasharray:4 5; opacity:.8; filter:none; }
    /* Pemegang junction — admin boleh seret untuk susun pertemuan cabang */
    svg.links .junction-handle {
      pointer-events: auto;
      fill: var(--gold);
      stroke: var(--card);
      stroke-width: 2;
      opacity: .85;
      transition: transform .15s ease, opacity .15s ease;
      transform-box: fill-box; transform-origin: center;
    }
    svg.links .junction-handle:hover { opacity: 1; transform: scale(1.25); }
    /* Label kecil pada cabang anak (ibu × bapa) */
    svg.links .branch-lbl rect {
      fill: var(--card);
      stroke: var(--gold);
      stroke-width: 1;
      filter: drop-shadow(0 2px 4px color-mix(in oklab, var(--shadow) 50%, transparent));
    }
    svg.links .branch-lbl text {
      fill: var(--ink);
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      paint-order: stroke;
    }

    /* ====== PROFIL HEADER (modal) ====== */
    .profile-head { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
    .profile-avatar {
      width:84px; height:84px; flex-shrink:0;
      border-radius:50%; overflow:hidden;
      background:linear-gradient(180deg,var(--gold-2),var(--gold));
      display:grid; place-items:center;
      color:#241704; font-weight:800; font-size:30px;
      border:2px solid color-mix(in oklab, var(--gold) 70%, var(--ink));
      box-shadow:0 6px 14px -4px var(--shadow);
    }
    .profile-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
    .profile-meta { min-width:0; flex:1; }
    .profile-meta .pn { font-family:var(--font-head); font-size:1.25rem; font-weight:800; line-height:1.15; word-break:break-word; }
    .profile-meta .ps { font-size:.78rem; color:var(--ink-soft); margin-top:4px; }
    .profile-info { display:grid; gap:6px; padding:12px 14px; border-radius:12px; font-size:.88rem; line-height:1.4; }
    .profile-info > div { word-break:break-word; }
    .profile-info b { color:var(--ink-soft); margin-right:4px; font-weight:700; }

    /* ====== CROPPER ====== */
    .crop-wrap { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; }
    .crop-box {
      width:200px; height:200px; border-radius:50%;
      overflow:hidden; position:relative; flex-shrink:0;
      background:#222; border:2px solid var(--gold);
      box-shadow:0 0 0 4px color-mix(in oklab, var(--gold) 25%, transparent);
      cursor:move; touch-action:none; user-select:none;
    }
    .crop-box img { position:absolute; transform-origin:0 0; pointer-events:none; max-width:none; }
    .crop-hint { font-size:.75rem; color:var(--ink-soft); flex:1; min-width:140px; }
    .crop-controls { display:flex; gap:8px; align-items:center; margin-top:8px; }
    .crop-controls input[type=range] { flex:1; }

    .note {
      position:absolute; padding:10px 14px; border-radius:10px;
      background:linear-gradient(180deg, #fff7c2, #ffe98a);
      color:#3b2a05; box-shadow:0 10px 22px -8px rgba(0,0,0,.35);
      border:1px solid #c9a23b; max-width:280px;
    }
    .note.pinned::after { content:"📌"; position:absolute; top:-10px; right:-6px; }

    .scrim { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:60; display:none; align-items:center; justify-content:center; padding:16px; }
    .scrim.show { display:flex }
    .modal { width:min(680px, 96vw); max-height:92vh; overflow:auto; border-radius:18px; padding:18px; }
    .field { display:flex; flex-direction:column; gap:.25rem; margin-bottom:.6rem }
    .field label { font-size:.78rem; color:var(--ink-soft); font-weight:700 }
    .field input, .field select, .field textarea {
      background:color-mix(in oklab, var(--card) 90%, white 10%);
      color:var(--ink);
      border:1px solid color-mix(in oklab, var(--line) 60%, transparent);
      border-radius:.6rem; padding:.5rem .65rem; font-size:.95rem; outline:none;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--gold); box-shadow:0 0 0 3px color-mix(in oklab, var(--gold) 30%, transparent); }
    .diff-wrap { overflow-x:auto; border:1px solid color-mix(in oklab,var(--line) 45%,transparent); border-radius:.65rem; }
    table.diff { width:100%; border-collapse:collapse; min-width:480px; font-size:.78rem; }
    table.diff th, table.diff td { padding:.45rem .55rem; text-align:left; border-bottom:1px solid color-mix(in oklab,var(--line) 30%,transparent); vertical-align:top; }
    table.diff th { color:var(--ink-soft); background:color-mix(in oklab,var(--gold) 10%,transparent); }
    table.diff .diff-changed td { background:color-mix(in oklab,var(--gold-2) 18%,transparent); }

    #notifyDock {
      position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
      z-index:90; display:flex; flex-direction:column; gap:8px;
      width:min(440px, 94vw); pointer-events:none;
    }
    .notify {
      pointer-events:auto;
      display:grid; grid-template-columns:auto 1fr auto; align-items:flex-start;
      gap:.6rem; padding:.7rem .9rem; border-radius:.85rem;
      background:linear-gradient(180deg, var(--card), var(--card-2));
      color:var(--ink); border:1px solid var(--line);
      box-shadow:0 14px 36px -12px var(--shadow), 0 4px 10px -4px var(--shadow);
      font-size:.9rem; line-height:1.35;
      transform:translateY(10px); opacity:0;
      animation:notifyIn .22s cubic-bezier(.2,.7,.2,1) forwards;
    }
    .notify-out { animation:notifyOut .2s ease forwards; }
    @keyframes notifyIn { to{ transform:translateY(0); opacity:1; } }
    @keyframes notifyOut { to{ transform:translateY(6px); opacity:0; } }
    .notify-ic { font-size:1.1rem; line-height:1.2; }
    .notify-msg { word-break:break-word; }
    .notify-x {
      background:transparent; border:0; color:var(--ink-soft);
      cursor:pointer; font-size:1rem; padding:.05rem .35rem; border-radius:.4rem;
    }
    .notify-x:hover { background:color-mix(in oklab, var(--ink) 10%, transparent); color:var(--ink); }
    .notify-info    { border-color: color-mix(in oklab, var(--line) 60%, transparent); }
    .notify-success { border-color: color-mix(in oklab, var(--ok) 65%, transparent);
                      box-shadow:0 14px 36px -12px var(--shadow), 0 0 0 1px color-mix(in oklab, var(--ok) 35%, transparent) inset; }
    .notify-warn    { border-color: color-mix(in oklab, var(--gold) 75%, transparent);
                      background:linear-gradient(180deg, color-mix(in oklab, var(--gold-2) 25%, var(--card)), var(--card-2)); }
    .notify-error   { border-color: color-mix(in oklab, var(--danger) 75%, transparent);
                      background:linear-gradient(180deg, color-mix(in oklab, var(--danger) 14%, var(--card)), var(--card-2));
                      box-shadow:0 18px 40px -10px color-mix(in oklab, var(--danger) 40%, var(--shadow)),
                                 0 0 0 1px color-mix(in oklab, var(--danger) 45%, transparent) inset; }
    .notify-sticky .notify-x { color:var(--danger); font-weight:800; }
    .notify-sticky .notify-x:hover { background:color-mix(in oklab, var(--danger) 18%, transparent); }

    #splash {
      position:fixed; inset:0; z-index:100;
      display:grid; place-items:center;
      background:
        radial-gradient(800px 500px at 50% 30%, color-mix(in oklab, var(--gold) 35%, transparent), transparent 70%),
        linear-gradient(135deg, var(--bg), var(--bg2));
    }
    #splash .logo {
      width:120px; height:120px; border-radius:30px;
      display:grid; place-items:center; font-size:60px;
      background:linear-gradient(180deg, var(--gold-2), var(--gold));
      color:#241704; box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 30px 60px -10px var(--shadow);
      margin-bottom:18px;
    }
    .spinner { width:34px; height:34px; border-radius:50%; border:3px solid color-mix(in oklab, var(--gold) 40%, transparent); border-top-color:var(--gold); animation:spin 1s linear infinite }
    @keyframes spin { to { transform:rotate(360deg) } }

    .node.match { box-shadow:0 0 0 3px var(--accent), 0 22px 40px -14px var(--shadow); animation:pulse 1.2s ease-in-out infinite alternate; }
    @keyframes pulse { to { box-shadow:0 0 0 6px color-mix(in oklab, var(--accent) 60%, transparent), 0 22px 40px -14px var(--shadow); } }

    .tab { padding:.5rem .9rem; border-radius:.6rem; cursor:pointer; font-weight:700; color:var(--ink-soft) }
    .tab.active { background:color-mix(in oklab, var(--gold) 25%, transparent); color:var(--ink) }

    .niceScroll::-webkit-scrollbar { width:10px; height:10px }
    .niceScroll::-webkit-scrollbar-thumb { background:color-mix(in oklab, var(--gold) 60%, transparent); border-radius:8px }

    .zoomDock {
      position:fixed; right:14px; bottom:14px; z-index:35;
      display:flex; flex-direction:column; gap:8px;
    }
    .zoomDock button {
      width:46px; height:46px; border-radius:14px;
      display:grid; place-items:center; font-size:20px;
    }

    #pendingBadge {
      position:absolute; top:-6px; right:-6px; background:var(--danger); color:#fff;
      border-radius:999px; font-size:10px; padding:2px 6px; font-weight:800;
    }

    @media (max-width: 640px){
      .node { width:180px; padding:10px }
      .node .avatar { width:54px; height:54px }
    }

    /* ====== SPLASH AURA ====== */
    #splash {
      position:fixed; inset:0; z-index:100;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px;
      background:
        radial-gradient(900px 600px at 50% 38%, color-mix(in oklab, var(--gold) 32%, transparent), transparent 70%),
        radial-gradient(700px 500px at 50% 80%, color-mix(in oklab, var(--gold-2) 22%, transparent), transparent 75%),
        linear-gradient(135deg, var(--bg), var(--bg2));
      overflow:hidden;
    }
    #splash::before, #splash::after {
      content:""; position:absolute; inset:-20%; pointer-events:none;
      background:
        radial-gradient(2px 2px at 20% 30%, color-mix(in oklab, var(--gold-2) 80%, transparent), transparent 60%),
        radial-gradient(2px 2px at 70% 20%, color-mix(in oklab, var(--gold) 70%, transparent), transparent 60%),
        radial-gradient(1.5px 1.5px at 80% 70%, color-mix(in oklab, var(--gold-2) 70%, transparent), transparent 60%),
        radial-gradient(1.5px 1.5px at 30% 80%, color-mix(in oklab, var(--gold) 70%, transparent), transparent 60%),
        radial-gradient(1px 1px at 50% 50%, color-mix(in oklab, var(--gold-2) 60%, transparent), transparent 60%);
      opacity:.55; animation: starDrift 14s linear infinite;
    }
    #splash::after { animation-duration: 22s; animation-direction: reverse; opacity:.35; }
    @keyframes starDrift { to { transform: translate3d(40px,-30px,0) rotate(8deg); } }

    .aura-stage {
      position:relative; width:260px; height:260px;
      display:grid; place-items:center;
    }
    .aura-core {
      position:absolute; width:96px; height:96px; border-radius:50%;
      background:
        radial-gradient(circle at 35% 30%, #fff7d2 0%, var(--gold-2) 35%, var(--gold) 70%, color-mix(in oklab, var(--gold) 50%, black 50%) 100%);
      box-shadow:
        0 0 30px color-mix(in oklab, var(--gold-2) 70%, transparent),
        0 0 80px color-mix(in oklab, var(--gold) 55%, transparent),
        0 0 140px color-mix(in oklab, var(--gold) 35%, transparent),
        inset 0 -8px 18px rgba(0,0,0,.25),
        inset 0 6px 14px rgba(255,255,255,.6);
      animation: corePulse 2.4s ease-in-out infinite;
    }
    @keyframes corePulse {
      0%,100% { transform:scale(1); filter:brightness(1); }
      50%     { transform:scale(1.08); filter:brightness(1.18); }
    }
    .aura-ring {
      position:absolute; border-radius:50%;
      border:1.5px solid color-mix(in oklab, var(--gold) 70%, transparent);
      box-shadow:
        0 0 24px color-mix(in oklab, var(--gold-2) 50%, transparent),
        inset 0 0 24px color-mix(in oklab, var(--gold) 35%, transparent);
      opacity:0; animation: auraExpand 2.6s cubic-bezier(.2,.7,.2,1) infinite;
    }
    .aura-r1 { width:120px; height:120px; animation-delay:0s; }
    .aura-r2 { width:120px; height:120px; animation-delay:.85s; }
    .aura-r3 { width:120px; height:120px; animation-delay:1.7s; }
    @keyframes auraExpand {
      0%   { transform:scale(.6); opacity:0; border-width:2.5px; }
      20%  { opacity:.95; }
      100% { transform:scale(2.6); opacity:0; border-width:1px; }
    }
    .aura-orbit {
      position:absolute; inset:0; animation: orbitSpin 6s linear infinite;
    }
    .aura-spark {
      position:absolute; width:10px; height:10px; border-radius:50%;
      background:radial-gradient(circle, #fff7d2, var(--gold-2) 50%, transparent 70%);
      box-shadow:0 0 14px color-mix(in oklab, var(--gold-2) 80%, transparent);
      top:50%; left:50%; margin:-5px 0 0 -5px;
    }
    .aura-spark.s1 { transform: rotate(0deg)   translateX(115px); }
    .aura-spark.s2 { transform: rotate(120deg) translateX(115px); }
    .aura-spark.s3 { transform: rotate(240deg) translateX(115px); }
    @keyframes orbitSpin { to { transform: rotate(360deg); } }

    .splash-text { text-align:center; max-width:90vw; z-index:1; }
    .splash-title {
      font-size:clamp(1.6rem, 4vw, 2.4rem); font-weight:800; letter-spacing:2px;
      background:linear-gradient(180deg, var(--gold-2), var(--gold));
      -webkit-background-clip:text; background-clip:text; color:transparent;
      text-shadow:0 2px 30px color-mix(in oklab, var(--gold) 40%, transparent);
      animation: titleGlow 2.4s ease-in-out infinite;
    }
    @keyframes titleGlow { 50% { filter: drop-shadow(0 0 18px color-mix(in oklab, var(--gold-2) 60%, transparent)); } }
    .splash-sub { color:var(--ink-soft); font-size:.92rem; margin-top:6px; letter-spacing:.5px; }
    .splash-bar {
      width:min(280px, 70vw); height:4px; margin:18px auto 10px;
      background:color-mix(in oklab, var(--gold) 18%, transparent);
      border-radius:999px; overflow:hidden; position:relative;
    }
    .splash-bar span {
      display:block; height:100%; width:38%;
      background:linear-gradient(90deg, transparent, var(--gold-2), var(--gold), transparent);
      box-shadow:0 0 16px var(--gold-2);
      animation: barSlide 1.6s ease-in-out infinite;
    }
    @keyframes barSlide {
      0%   { transform:translateX(-120%); }
      100% { transform:translateX(320%); }
    }
    .splash-tip { font-size:.78rem; color:var(--ink-soft); font-style:italic; margin-top:6px; }

    .brand-mono {
      width:38px; height:38px; border-radius:12px;
      display:grid; place-items:center;
      font-family:var(--font-head); font-weight:800; font-size:14px; letter-spacing:1px;
      color:#241704;
    }
    .lb-img { cursor: zoom-in; }
    #lightbox {
      position: fixed; inset: 0; z-index: 70;
      display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,.88); backdrop-filter: blur(6px);
      padding: 16px;
    }
    #lightbox.show { display: flex; }
    #lightbox img {
      max-width: 100%; max-height: 100%;
      border-radius: 14px; box-shadow: 0 28px 70px rgba(0,0,0,.55);
      object-fit: contain;
    }
    #lightbox .lb-close {
      position: absolute; top: 16px; right: 16px;
      width: 48px; height: 48px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(0,0,0,.55); color: #fff;
      font-size: 24px; border: 1px solid rgba(255,255,255,.3);
      cursor: pointer; backdrop-filter: blur(4px);
    }
    #lightbox .lb-close:hover { background: rgba(0,0,0,.8); }
  </style>
</head>
<body data-theme="royal">

  <div id="splash">
    <div class="aura-stage">
      <div class="aura-ring aura-r1"></div>
      <div class="aura-ring aura-r2"></div>
      <div class="aura-ring aura-r3"></div>
      <div class="aura-core"></div>
      <div class="aura-orbit">
        <span class="aura-spark s1"></span>
        <span class="aura-spark s2"></span>
        <span class="aura-spark s3"></span>
      </div>
    </div>
    <div class="splash-text">
      <div class="font-head splash-title">Salasilah Keluarga Elit</div>
      <div class="splash-sub">Mengaktifkan aura warisan keluarga anda…</div>
      <div class="splash-bar"><span></span></div>
      <div id="tip" class="splash-tip">Petua: Klik kad ahli untuk pilihan lengkap.</div>
    </div>
  </div>

  <header class="topbar h-[60px] px-3 flex items-center gap-2">
    <div class="flex items-center gap-2 mr-2">
      <div class="brand-mono gold-edge">SK</div>
      <div class="font-head font-extrabold text-[15px] sm:text-lg leading-none ink">Salasilah <span class="hidden sm:inline">Keluarga Elit</span></div>
    </div>

    <div class="flex-1 flex items-center justify-center gap-2">
      <div class="relative w-full max-w-md">
        <input id="search" type="text" placeholder="Cari nama, tempat, tahun, catatan…"
          class="w-full bevel-soft rounded-xl pl-9 pr-20 py-2 outline-none text-sm" style="color:var(--ink)"/>
        <span class="absolute left-3 top-1/2 -translate-y-1/2 ink-soft">🔍</span>
        <div class="absolute right-1 top-1/2 -translate-y-1/2 flex gap-1">
          <button id="searchPrev" class="btn btn-ghost !py-1 !px-2" title="Sebelumnya">↑</button>
          <button id="searchNext" class="btn btn-ghost !py-1 !px-2" title="Seterusnya">↓</button>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-1">
      <button id="btnAutoTree" class="btn btn-ghost" title="Auto Family Tree — susun salasilah automatik" style="display:none">🌳<span class="hidden sm:inline" style="margin-left:4px;font-size:12px">Auto</span></button>
      <button id="btnAddNote" class="btn btn-ghost" title="Tambah nota" style="display:none">📝</button>
      <button id="btnZoomFit" class="btn btn-ghost" title="Muat skrin">⛶</button>
      <button id="btnAdmin" class="btn btn-ghost relative" title="Pentadbir" style="display:none">🛡️<span id="pendingBadge" style="display:none">0</span></button>
      <button id="btnSettings" class="btn btn-ghost" title="Tetapan">⚙️</button>
      <button id="btnAccount" class="btn btn-ghost relative" title="Akaun / Log Masuk">👤</button>
    </div>
  </header>

  <main id="stage">
    <div id="world">
      <svg class="links" id="links" viewBox="0 0 6000 4000" preserveAspectRatio="none"></svg>
      <div id="nodes"></div>
      <div id="notes"></div>
    </div>
  </main>

  <div class="zoomDock">
    <button class="gold-edge" id="zIn">+</button>
    <button class="gold-edge" id="zOut">−</button>
    <button class="gold-edge" id="zReset" title="Reset">⟲</button>
  </div>

  <div id="notifyDock"></div>

  <div class="scrim" id="scrim">
    <div class="modal bevel niceScroll" id="modal"></div>
  </div>

  <div id="lightbox" onclick="if(event.target.id==='lightbox')closeImageLightbox()">
    <button class="lb-close" onclick="closeImageLightbox()" aria-label="Tutup">✕</button>
    <img id="lbImg" src="" alt="Gambar besar">
  </div>

  <script src="app.js" defer></script>
</body>
</html>
