  <style>

    html[data-theme="royal"] { --bg: #0f1b3d; --bg-alt: #1e3a5f; --card: #1b2c52; --line: #c9a84c; --line-soft: #8a7a3a; --ink: #f0e8d0; --ink-soft: #b8b090; --gold: #e8c96a; --gold-dark: #c9a84c; --accent: #7cb8ff; --rose: #ff9ec0; --shadow: 0 6px 22px -8px rgba(0,0,0,.6); --bg-radial-a: #1e3a5f; --bg-radial-b: #0a1226; }
    html[data-theme="emerald"] { --bg: #f0ebd8; --bg-alt: #dde3c8; --card: #fbfaef; --line: #4a6741; --line-soft: #87a878; --ink: #1f3322; --ink-soft: #5a6f4f; --gold: #7d9b76; --gold-dark: #4a6741; --accent: #0d7a5f; --rose: #c4654a; --shadow: 0 6px 18px -10px rgba(20,55,30,.45); --bg-radial-a: #e8f0d8; --bg-radial-b: #cfe0b8; }
    html[data-theme="rose"] { --bg: #fdf1f4; --bg-alt: #f8dce3; --card: #fffafb; --line: #c45c7c; --line-soft: #e88aab; --ink: #4a1230; --ink-soft: #7d3a55; --gold: #c44569; --gold-dark: #8b2848; --accent: #9b72cf; --rose: #c44569; --shadow: 0 6px 18px -10px rgba(150,30,70,.35); --bg-radial-a: #fef0f5; --bg-radial-b: #f6c8d8; }

    html, body { height: 100%; background: radial-gradient(1200px 700px at 20% 10%, var(--bg-radial-a) 0%, transparent 60%), radial-gradient(900px 600px at 80% 90%, var(--bg-radial-b) 0%, transparent 60%), var(--bg); color: var(--ink); font-family: 'Inter', 'Noto Naskh Arabic', 'Scheherazade New', 'Amiri', system-ui, sans-serif; }

    /* === NODE === */

    /* === DRAFT STYLING (MOD DRAF OPTIMISTIK) === */
    .node.is-draft { border: 2px dashed #059669; background: linear-gradient(180deg, #ecfdf5, #d1fae5); box-shadow: 0 0 0 3px rgba(5,150,105,0.15), 0 14px 28px -14px rgba(4,120,87,0.4); }
    .node.is-draft::after { content: ""; position: absolute; inset: -4px; border-radius: 22px; border: 2px solid rgba(16,185,129,0.3); pointer-events: none; animation: pulseDraft 2s infinite; }
    @keyframes pulseDraft { 0% { opacity: 0.4; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.02); } 100% { opacity: 0.4; transform: scale(0.98); } }
    .draft-chip { position: absolute; top: -12px; right: -10px; z-index: 5; display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 999px; background: #059669; border: 1.5px solid #fff; color: #fff; font-size: 10px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; box-shadow: 0 4px 10px rgba(5,150,105,0.5); }
    .map-note.is-draft { border-style: dashed; border-color: #059669; box-shadow: 0 0 0 3px rgba(5,150,105,0.2); }

    .node.pending { background: linear-gradient(180deg, #f2f4f7, #d8dee7); border-color: #5b6472; box-shadow: 0 0 0 3px rgba(245,158,11,.36), 0 20px 40px -18px rgba(71,85,105,.34); }
    .node.pending .name { color: #111827; } .node.pending .meta { color: #334155; font-weight: 700; }
    .couple.pending-family { background: linear-gradient(180deg, rgba(245,158,11,.10), rgba(217,226,236,.96)); border: 2px dashed #f59e0b; }
    .couple.pending-family .node { background: linear-gradient(180deg, #f2f4f7, #d8dee7); border-color: #5b6472; }
    .pending-chip { position: absolute; top: -10px; left: 10px; z-index: 3; display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 999px; background: linear-gradient(180deg, #fff4d6, #f7c86b); border: 1px solid #d97706; color: #7c2d12; font-size: 10px; font-weight: 800; text-transform: uppercase; }
    
    .node.root { border-color: var(--gold-dark); background: linear-gradient(180deg, color-mix(in oklab, var(--gold) 26%, #fffdf2 74%), color-mix(in oklab, var(--card) 78%, var(--gold) 22%)); }
    .node.is-user { background: linear-gradient(180deg, #fff5b5, #ffd874); border-color: #c9a300; }
    .node.is-admin { border-color: #b8870a; box-shadow: 0 0 0 2px rgba(255,200,40,.55), 0 24px 50px -18px rgba(184,135,10,.6); }
    .node-badges { position: absolute; top: -8px; right: -8px; display: flex; gap: 4px; z-index: 2; }
    .badge-user, .badge-admin { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(160deg,#fff,#f3d97a); border: 1.5px solid #b8870a; font-size: 11px; font-weight: 700; box-shadow: 0 4px 10px -3px rgba(0,0,0,.4); color: #5a3e00; }
    .badge-admin { background: linear-gradient(160deg,#ffe88a,#e8b900); font-size: 13px; color: #3a2600; }
    .node.hanging { border-style: dashed; border-color: #e85d3a; opacity: .95; background: linear-gradient(180deg, #fff3ee, #ffd8c5); }
    .node.spouse { background: linear-gradient(180deg, #fdf2f4, #f1d1d9); border-color: #b85a72; }
    .node.spouse.divorced { border-style: dashed; opacity: .85; } .node.spouse.deceased { filter: grayscale(.3); opacity: .9; }

    body.reparent-mode .node { animation: reparentPulse 1.4s ease-in-out infinite; cursor: crosshair; }
    body.reparent-mode .node[data-node-id]:hover { box-shadow: 0 0 0 4px #3b82f6, 0 24px 50px -18px rgba(59,130,246,.6); }
    @keyframes reparentPulse { 0%,100%{outline:1px dashed rgba(59,130,246,.4); outline-offset:4px;} 50%{outline:2px dashed rgba(59,130,246,.9); outline-offset:6px;} }

    .trees-wrap { display: flex; flex-direction: column; align-items: center; gap: 60px; }
    .tree-block { display: flex; flex-direction: column; align-items: center; }
    .hanging-block { position: relative; padding-top: 24px; }
    .hanging-label { font-family: 'Cormorant Garamond', serif; font-size: 13px; color: #c0392b; background: #fff1ea; border: 1.5px dashed #e85d3a; border-radius: 10px; padding: 6px 14px; margin-bottom: 6px; }
    .dashed-link { width: 3px; height: 40px; background-image: linear-gradient(180deg, #e85d3a 50%, transparent 50%); background-size: 3px 12px; margin: 0 auto 4px; }
    .kid-group { position: relative; display: flex; flex-direction: column; align-items: center; margin: 0 12px; }

    /* === NOTA PETA === */
    .map-note { position: absolute; z-index: 5; background: rgba(255,250,225,.92); border: 1.5px solid var(--gold); border-radius: 10px; padding: 6px 10px; box-shadow: 0 4px 14px -4px rgba(120,80,10,.4); max-width: 300px; white-space: pre-wrap; word-break: break-word; transition: .15s; user-select: none; }
    .map-note:hover { box-shadow: 0 8px 22px -6px rgba(120,80,10,.55); transform: translateY(-1px); }
    .map-note.pending { border-color: #d97706; background: linear-gradient(180deg, #fff6df, #f1e2bf); color: #1f2937 !important; }
    .map-note.pinned { border-style: double; border-width: 3px; }
    .note-pin, .note-pending { display: inline-block; margin-left: 6px; font-size: 0.8em; }
    body.note-add-cursor, body.note-add-cursor #stage, body.note-add-cursor #canvas { cursor: crosshair !important; }
    .node.highlight { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,111,160,.45), var(--shadow); }
    .node img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid var(--line-soft); margin-bottom: 6px; background: #fff8e3; }
    .node .name { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 15.5px; text-align: center; line-height: 1.15; text-shadow: 0 1px 0 rgba(255,255,255,.35); }
    .node .meta { font-size: 10px; color: #425466; margin-top: 3px; font-weight: 700; }
    .node .meta.parentage { max-width: 170px; text-align: center; line-height: 1.25; white-space: normal; font-size: 9.5px; }
    .kid-group-label { font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #7c2d12; background: #fff4ea; border: 2px solid var(--accent); border-radius: 8px; padding: 4px 12px; margin: 4px auto 12px; display: inline-block; text-align: center; font-weight: 700; }

    /* === COUPLE === */
    .couple { display: inline-flex; align-items: center; gap: 0; padding: 8px; background: color-mix(in oklab, var(--card) 92%, #ffffff 8%); border-radius: 20px; border: 1px dashed color-mix(in oklab, var(--line) 45%, #ffffff 55%); box-shadow: 0 8px 18px -16px rgba(0,0,0,.35); flex-direction: row !important; flex-wrap: nowrap !important; white-space: nowrap; }
    .couple .node { margin: 0 4px; }
    .couple-link { width: 30px; height: 4px; background: repeating-linear-gradient(90deg, var(--rose) 0 6px, transparent 6px 10px); border-radius: 2px; position: relative; flex-shrink: 0 !important; }
    .couple-link::before { content: "♥"; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-55%); color: var(--rose); font-size: 14px; background: var(--bg); padding: 0 3px; border-radius: 50%; }

    /* === TREE === */
    ul.tree, ul.tree ul { list-style: none; margin: 0; padding: 0; position: relative; }
    ul.tree { display: flex; justify-content: center; }
    ul.tree li { display: flex; flex-direction: column; align-items: center; padding: 36px 14px 0; position: relative; }
    ul.tree li::before, ul.tree li::after { content: ''; position: absolute; top: 0; height: 36px; width: 50%; border-top: 2px solid var(--line); }
    ul.tree li::before { left: 0; border-right: 2px solid var(--line); } ul.tree li::after { left: 50%; }
    ul.tree li:only-child::before, ul.tree li:only-child::after { display: none; }
    ul.tree li:only-child { padding-top: 36px; }
    ul.tree li:only-child > .branch::before { content: ''; position: absolute; top: -36px; left: 50%; width: 2px; height: 36px; background: var(--line); }
    ul.tree li:first-child::before, ul.tree li:last-child::after { border: 0 none; }
    ul.tree li:last-child::before { border-right: 2px solid var(--line); border-radius: 0 8px 0 0; }
    ul.tree li:first-child::after { border-radius: 8px 0 0 0; }
    ul.tree li > .branch { display: flex; justify-content: center; position: relative; }
    ul.tree > li::before, ul.tree > li::after { display: none; }
    .children-row { display: flex; }

    /* === UI MODAL === */
    .modal-bg { background: rgba(28,22,12,.56); }
    .btn { padding: 8px 14px; border-radius: 10px; font-weight: 500; font-size: 13px; transition: .15s; }
    .btn-primary { background: var(--gold-dark); color: #fff8e3; } .btn-primary:hover { background: var(--gold); }
    .btn-ghost { background: rgba(176,138,77,.15); color: var(--ink); border: 1px solid rgba(176,138,77,.3); }
    .btn-ghost:hover { background: rgba(176,138,77,.25); }
    .input { width: 100%; padding: 9px 12px; border-radius: 10px; background: #fffdf8; border: 1px solid color-mix(in oklab, var(--line-soft) 70%, #aab4c0 30%); font-size: 13px; font-weight: 600; }
    .input:focus { outline: none; border-color: var(--gold-dark); box-shadow: 0 0 0 3px rgba(168,128,31,.18); }
    .ctx { position: fixed; z-index: 60; background: #fffaf0; border: 1px solid var(--line-soft); border-radius: 10px; padding: 6px; min-width: 200px; box-shadow: 0 14px 32px rgba(60,40,10,.25); }
    .ctx button { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; font-size: 13px; } .ctx button:hover { background: rgba(176,138,77,.18); }
    #stage { cursor: grab; } #stage:active { cursor: grabbing; }
    .tab.active { background: var(--gold-dark); color: #fff8e3; }
    #canvas { padding: 400px 800px; min-width: 6000px; }
    @media(max-width: 640px) { .node { min-width: 120px; padding: 10px; } .node img { width: 54px; height: 54px; } #canvas { padding: 200px 400px; min-width: 3000px; } }

    #err-stack { position: fixed; top: 64px; right: 12px; left: 12px; z-index: 200; display: flex; flex-direction: column; gap: 8px; pointer-events: none; max-width: 520px; margin-left: auto; }
    .err-card { pointer-events: auto; background: linear-gradient(160deg,#fff5f5,#fde2e2); border: 1.5px solid #c0392b; border-radius: 14px; box-shadow: 0 12px 30px -10px rgba(150,30,20,.45); padding: 12px 14px; color: #3b1010; font-size: 13px; animation: errIn .25s ease-out; }
    @keyframes errIn { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
    .err-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
    .err-title { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 15px; }
    .err-actions { display: flex; gap: 4px; } .err-btn { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,.06); border: 1px solid rgba(0,0,0,.12); }
    .err-msg { white-space: pre-wrap; word-break: break-word; font-family: monospace; font-size: 11.5px; max-height: 180px; overflow: auto; background: rgba(255,255,255,.55); padding: 6px 8px; border-radius: 6px; border: 1px dashed rgba(0,0,0,.15); }

    #loading-screen { position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center; background: radial-gradient(1000px 600px at 20% 10%, var(--bg-radial-a) 0%, transparent 60%), radial-gradient(900px 550px at 80% 90%, var(--bg-radial-b) 0%, transparent 60%), var(--bg); transition: opacity .28s ease, visibility .28s ease; }
    #loading-screen.hidden-screen { opacity: 0; visibility: hidden; pointer-events: none; }
    .loading-card { position: relative; min-width: 320px; max-width: 420px; text-align: center; padding: 30px 26px; border-radius: 28px; overflow: hidden; border: 1px solid color-mix(in oklab, var(--gold) 45%, #ffffff 55%); box-shadow: 0 34px 80px -36px rgba(0,0,0,.5); }
    .loading-orbit { position: relative; width: 120px; height: 120px; margin: 0 auto 18px; display: grid; place-items: center; }
    .loading-core { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(145deg, color-mix(in oklab, var(--gold) 72%, white 28%), color-mix(in oklab, var(--gold-dark) 78%, black 22%)); color: #fff8e3; font-size: 34px; box-shadow: 0 18px 40px -20px rgba(168,128,31,.75); animation: pulseCore 2.3s ease-in-out infinite; }
    .loading-ring { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid transparent; border-top-color: rgba(168,128,31,.95); animation: spin 7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } } @keyframes pulseCore { 0%,100% { transform: scale(.96); } 50% { transform: scale(1.04); } }
    .loading-progress { position: relative; width: 100%; height: 10px; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.36); border: 1px solid rgba(176,138,77,.22); margin-top: 14px; }
    .loading-progress::before { content: ""; position: absolute; inset: 0 auto 0 -35%; width: 35%; background: linear-gradient(90deg, transparent, rgba(168,128,31,.85), rgba(255,255,255,.85), transparent); animation: loadingBar 1.8s ease-in-out infinite; }
    @keyframes loadingBar { 0% { left: -35%; } 100% { left: 100%; } }
  
    .node.draggable-node { cursor: grab; }
    .node.draggable-node.dragging { cursor: grabbing !important; opacity: .92; box-shadow: 0 0 0 3px #3b82f6, 0 30px 60px -20px rgba(59,130,246,.6); z-index: 50; transition: none !important; }
    .node.draggable-node.has-manual-pos { outline: 2px dashed rgba(59,130,246,.45); outline-offset: 2px; }
    .node.draggable-node:hover { transform: translateY(-3px) scale(1.02); }
    .node.draggable-node.has-manual-pos:hover { transform: translate(var(--node-dx,0), var(--node-dy,0)); }
</style>
</head>
<body class="overflow-hidden">

  <div id="loading-screen">
    <div class="loading-card glass">
      <div class="loading-orbit">
        <div class="loading-ring"></div>
        <div class="loading-core">🌳</div>
      </div>
      <h2 class="serif text-2xl font-bold mb-2">Memuatkan salasilah</h2>
      <p id="loading-text" class="text-sm">Sila tunggu sementara maklumat keluarga dipaparkan<span id="loading-dots"></span></p>
      <p id="loading-phase" class="text-xs mt-2">Menyusun cabang keluarga dan hubungan setiap generasi…</p>
      <div class="loading-progress"></div>
    </div>
  </div>

  <header class="fixed top-0 inset-x-0 z-40 glass px-4 py-2 flex items-center justify-between gap-2">
    <div class="flex items-center gap-2 min-w-0">
      <span class="text-2xl">🌳</span>
      <div class="min-w-0">
        <h1 class="text-base font-bold tracking-wide truncate">SALASILAH ELIT</h1>
        <p id="user-info" class="text-[10px] truncate" style="color:var(--ink-soft)">Tidak log masuk</p>
      </div>
    </div>
    <div class="flex items-center gap-1 flex-wrap justify-end">
      <button id="btn-search" class="btn btn-ghost px-2" title="Cari">🔍</button>
      <button id="btn-zoom-in" class="btn btn-ghost px-2">＋</button>
      <button id="btn-zoom-out" class="btn btn-ghost px-2">−</button>
      <button id="btn-reset" class="btn btn-ghost px-2">⟳</button>
      <button id="btn-add-note" class="btn btn-ghost hidden" title="Tambah Nota">📝</button>
      <button id="btn-my-profile" class="btn btn-ghost hidden">Profil Saya</button>
      <button id="btn-admin" class="btn btn-ghost hidden">Admin</button>
      <button id="btn-settings" class="btn btn-ghost px-2">⚙</button>
      <button id="btn-auth" class="btn btn-primary">Log Masuk</button>
    </div>
  </header>

  <main id="stage" class="absolute inset-0 pt-16">
    <div id="canvas" class="origin-center flex justify-center items-start">
      <div id="tree-root" class="mt-32 text-center" style="color:var(--ink-soft)">
        <p class="text-lg serif">Memuatkan salasilah…</p>
      </div>
    </div>
  </main>

  <div id="ctx-menu" class="ctx hidden"></div>

  <!-- SEARCH BAR -->
  <div id="search-bar" class="hidden fixed top-16 inset-x-0 z-40 px-3 pt-2 flex justify-center">
    <div class="glass rounded-xl px-3 py-2 flex items-center gap-2 w-full max-w-xl">
      <span>🔍</span>
      <input id="search-input" class="input flex-1" placeholder="Cari nama, tempat, tahun, catatan…" />
      <span id="search-count" class="text-xs min-w-[60px] text-center" style="color:var(--ink-soft)">0/0</span>
      <button id="search-prev" class="btn btn-ghost px-2">↑</button>
      <button id="search-next" class="btn btn-ghost px-2">↓</button>
      <button id="search-close" class="btn btn-ghost px-2">✕</button>
    </div>
  </div>

  <!-- MODALS... -->
  <div id="modal-auth" class="fixed inset-0 z-50 modal-bg hidden items-center justify-center p-4">
    <div class="glass rounded-2xl w-full max-w-md p-6">
      <div class="flex gap-2 mb-4">
        <button data-tab="login" class="tab btn btn-ghost flex-1 active">Log Masuk</button>
        <button data-tab="register" class="tab btn btn-ghost flex-1">Daftar</button>
      </div>
      <form id="form-login" class="space-y-3">
        <input class="input" name="username" placeholder="Nama Samaran" required />
        <input class="input" name="password" type="password" placeholder="Password" required />
        <button class="btn btn-primary w-full">Masuk</button>
      </form>
      <form id="form-register" class="space-y-3 hidden">
        <input class="input" dir="auto" name="fullname" placeholder="Nama Penuh Anda" required />
        <input class="input" name="username" placeholder="Nama Samaran (unik)" required />
        <input class="input" name="email" type="email" placeholder="Email" required />
        <input class="input" name="phone" placeholder="No. WhatsApp" pattern="[0-9+\-\s]{8,}" required />
        <input class="input" dir="auto" name="fatherName" placeholder="Nama Penuh BAPA anda" required />
        <input class="input" dir="auto" name="motherName" placeholder="Nama Penuh IBU anda" required />
        <input class="input" name="password" type="password" placeholder="Password" required minlength="4" />
        <label class="text-xs block">Gambar Wajah</label>
        <input class="input" name="photo" type="file" accept="image/*" required />
        <button class="btn btn-primary w-full">Daftar</button>
      </form>
      <button onclick="closeModal('modal-auth')" class="mt-3 text-xs w-full">Tutup</button>
    </div>
  </div>

  <div id="modal-profile" class="fixed inset-0 z-50 modal-bg hidden items-center justify-center p-4">
    <div class="glass rounded-2xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
      <div id="profile-body"></div>
      <button onclick="closeModal('modal-profile')" class="btn btn-ghost w-full mt-4">Tutup</button>
    </div>
  </div>

  <div id="modal-my-profile" class="fixed inset-0 z-50 modal-bg hidden items-center justify-center p-4">
    <div class="glass rounded-2xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
      <div id="my-profile-body"></div>
      <button onclick="closeModal('modal-my-profile')" class="btn btn-ghost w-full mt-4">Tutup</button>
    </div>
  </div>

  <!-- NODE EDITOR -->
  <div id="modal-node" class="fixed inset-0 z-50 modal-bg hidden items-center justify-center p-4">
    <div class="glass rounded-2xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
      <h2 id="node-title" class="text-lg font-bold mb-3 serif">Ahli</h2>
      <form id="form-node" class="space-y-3">
        <input type="hidden" name="id" />
        <input type="hidden" name="parentId" />
        <input type="hidden" name="relation" value="child" />
        <div id="spouse-pick-wrap"></div>
        <input class="input" dir="auto" name="name" placeholder="Nama Penuh" required />
        <input class="input" dir="auto" name="nickname" placeholder="Nama Singkatan / Gelaran" />
        <div class="grid grid-cols-2 gap-2">
          <select class="input" name="gender">
            <option value="L">Lelaki</option>
            <option value="P">Perempuan</option>
          </select>
          <select class="input" name="status">
            <option value="hidup">Hidup</option>
            <option value="mati">Almarhum</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <input class="input" name="birth" placeholder="Tahun Lahir" />
          <input class="input" name="death" placeholder="Tahun Mati" />
        </div>
        <input class="input" name="birthplace" placeholder="Tempat Lahir" />
        <input class="input" name="deathplace" placeholder="Tempat Wafat" />
        <textarea class="input" dir="auto" name="notes" placeholder="Catatan" rows="3"></textarea>
        <label class="text-xs block">Gambar Profil</label>
        <input class="input" name="photo" type="file" accept="image/*" />
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeModal('modal-node')" class="btn btn-ghost flex-1">Batal</button>
          <button class="btn btn-primary flex-1">Simpan Ke Draf</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SPOUSE EDITOR -->
  <div id="modal-spouse" class="fixed inset-0 z-50 modal-bg hidden items-center justify-center p-4">
    <div class="glass rounded-2xl w-full max-w-md p-6">
      <h2 id="spouse-title" class="text-lg font-bold mb-3 serif">Tambah Pasangan</h2>
      <form id="form-spouse" class="space-y-3">
        <input type="hidden" name="parentId" />
        <input type="hidden" name="editOrder" value="" />
        <input class="input" dir="auto" name="name" placeholder="Nama Pasangan" required />
        <input class="input" dir="auto" name="nickname" placeholder="Nama Singkatan" />
        <div class="grid grid-cols-2 gap-2">
          <label class="text-xs block">Jantina <select class="input mt-1" name="gender"><option value="">— Pilih —</option><option value="L">Lelaki</option><option value="P">Perempuan</option></select></label>
          <label class="text-xs block">Pasangan ke- <input type="number" min="1" class="input mt-1" name="spouseOrder" value="1" required /></label>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <label class="text-xs block">Status <select class="input mt-1" name="status"><option value="hidup">Hidup</option><option value="cerai">Bercerai</option><option value="mati">Almarhum</option></select></label>
          <label class="text-xs block">Tahun Lahir <input class="input mt-1" name="birth" placeholder="Contoh: 1975" /></label>
        </div>
        <input class="input" name="birthplace" placeholder="Tempat Lahir" />
        <input class="input" name="death" placeholder="Tahun Mati" />
        <input class="input" name="deathplace" placeholder="Tempat Wafat" />
        <textarea class="input" dir="auto" name="notes" placeholder="Catatan" rows="3"></textarea>
        <label class="text-xs block">Gambar Pasangan</label>
        <input class="input" name="photo" type="file" accept="image/*" />
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeModal('modal-spouse')" class="btn btn-ghost flex-1">Batal</button>
          <button class="btn btn-primary flex-1">Simpan Ke Draf</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SETTINGS, ADMIN & NOTES MODAL (Omitted full HTML length for brevity, same structure maintained) -->
  <div id="modal-settings" class="fixed inset-0 z-50 modal-bg hidden items-center justify-center p-4">
    <div class="glass rounded-2xl w-full max-w-md p-6 space-y-3">
      <h2 class="text-lg font-bold serif">Tetapan</h2>
      <div id="theme-list" class="space-y-2"></div>
      <button onclick="closeModal('modal-settings')" class="btn btn-primary w-full">Tutup</button>
    </div>
  </div>

  <div id="modal-admin" class="fixed inset-0 z-50 modal-bg hidden items-center justify-center p-4">
    <div class="glass rounded-2xl w-full max-w-2xl p-6 max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-lg font-bold serif">Panel Admin</h2>
        <button onclick="closeModal('modal-admin')" class="btn btn-ghost">✕</button>
      </div>
      <div class="flex gap-2 mb-4 flex-wrap">
        <button data-atab="pending" class="tab btn btn-ghost active">Pending</button>
        <button data-atab="users" class="tab btn btn-ghost">Pengguna</button>
        <button data-atab="init" class="tab btn btn-ghost">Init Root</button>
      </div>
      <div id="admin-pending"></div>
      <div id="admin-users" class="hidden"></div>
      <div id="admin-init" class="hidden space-y-3">
        <input id="root-name" class="input" placeholder="Nama Root" />
        <label class="text-xs flex items-center gap-2"><input type="checkbox" id="root-hanging" /> Root Tergantung</label>
        <button id="btn-init-root" class="btn btn-primary w-full">Cipta Root</button>
      </div>
    </div>
  </div>

  <div id="modal-note" class="fixed inset-0 z-50 modal-bg hidden items-center justify-center p-4">
    <div class="glass rounded-2xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
      <h2 id="note-title" class="text-lg font-bold mb-3 serif">Nota</h2>
      <form id="form-note" class="space-y-3">
        <input type="hidden" name="id" />
        <input type="hidden" name="x" />
        <input type="hidden" name="y" />
        <textarea class="input" dir="auto" name="text" placeholder="Teks nota..." rows="3" required></textarea>
        <div class="grid grid-cols-2 gap-2">
          <label class="text-xs block">Font <select class="input mt-1" name="font"><option value="Cormorant Garamond">Cormorant</option><option value="Inter">Inter</option></select></label>
          <label class="text-xs block">Saiz <input type="number" class="input mt-1" name="size" value="18" required /></label>
        </div>
        <label class="text-xs block">Warna teks <input type="color" class="input mt-1 h-10" name="color" value="#3b2a14" /></label>
        <label id="note-pin-admin" class="text-xs flex items-center gap-2"><input type="checkbox" name="pinned" /> 📌 Pin nota ini</label>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeModal('modal-note')" class="btn btn-ghost flex-1">Batal</button>
          <button class="btn btn-primary flex-1">Simpan Ke Draf</button>
        </div>
      </form>
    </div>
  </div>

  <div id="err-stack"></div>
  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[100] hidden glass px-4 py-2 rounded-full text-sm font-bold shadow-xl"></div>

  <script src="app.js?v=2.22-id-pasangan"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js?v=219-layout-freeze').then(reg => reg.update()).catch(() => {});
    }
  </script>
</body>
</html>
